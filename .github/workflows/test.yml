name: Cross-platform manuscript review

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  review:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Document adapters, annotation ledger and formal statistics
        run: python -m unittest -v regression_onboard regression_adapters regression_store regression_merge regression_stats
      - name: Launch, submit, publish, merge and stop
        run: python regression_portable.py
